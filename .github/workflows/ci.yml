name: CI

on:
  push:
    # develop publishes to the dev registry, main to prod. See the `image` job.
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, container-free gates. Kept as a separate job from `tests` so a lint or
  # type failure reports in under a minute instead of waiting on Docker pulls.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen: uv.lock is committed and authoritative. Fail rather than
      # silently resolving a different dependency set than a developer has.
      - name: Install dependencies
        run: uv sync --frozen

      # Scoped to app/tests/alembic — NOT `.` — and that scope is deliberate:
      #
      #   * `ruff format` in ruff >= 0.15 also formats Python code blocks inside
      #     Markdown. Running it over `.` rewrites `.github/instructions/*.md`,
      #     `.github/skills/**`, `docs/superpowers/**` and `README.md`, whose
      #     snippets are illustrative prose, sometimes deliberately elided, and
      #     are the standards documents themselves. Nine of them fail today.
      #   * `ruff check .` reports one pre-existing SIM102 (collapsible nested
      #     `if`) in scripts/check_entity_registry.py. That file is itself a CI
      #     gate, so a cosmetic rewrite of its control flow carries a risk the
      #     lint fix does not repay.
      #
      # This scope is exactly what is verified locally, and it covers every line
      # of shipped application code. If scripts/ is ever brought into scope,
      # bring it into the local gate at the same time so the two cannot drift.
      - name: Lint
        run: uv run ruff check app tests alembic

      - name: Format
        run: uv run ruff format --check app tests alembic

      # The same checkers the PostToolUse hook runs. Hooks only cover agent
      # sessions in VS Code; CI is the real boundary. These parse source with
      # `ast` and never import the app, so they need no configuration.
      - name: Entity registry
        run: uv run python scripts/check_entity_registry.py

      - name: Route authorization
        run: uv run python scripts/check_route_authz.py

      - name: Migration safety
        run: uv run python scripts/check_migration_safety.py

      - name: Types
        run: uv run mypy app

      # Dependency vulnerabilities. See .github/instructions/dependencies.instructions.md:
      # a high or critical finding does not merge. pip-audit exits non-zero on any known
      # vulnerability, which is the gate. If an advisory is genuinely unreachable from our
      # usage, add `--ignore-vuln <ID>` here with a comment naming it and saying why -
      # never drop the step to make a build pass.
      - name: Dependency vulnerabilities
        run: uv run --with pip-audit pip-audit

  tests:
    name: Tests
    runs-on: ubuntu-latest
    # There is deliberately no `services: postgres:` block here.
    #
    # The suite uses testcontainers: tests/conftest.py starts its own
    # `postgres:17-alpine` container per session, runs `alembic upgrade head`
    # against it, and overrides the app's `get_db` dependency to point at it.
    # A `services:` Postgres would be started, ignored, and mislead the next
    # reader. What the suite actually needs from the runner is a working Docker
    # socket, which `ubuntu-latest` provides out of the box.
    #
    # ZCIP_DATABASE_URL below is a placeholder, not the database under test.
    # It exists only because app/api/deps.py calls `get_settings()` at module
    # import time to build an engine, so pytest collection fails without it and
    # without the three Entra values. Nothing ever connects to it.
    #
    # Note also that app/core/config.py reads a `.env` file when present. That
    # file is git-ignored and absent on a fresh runner by design; every value
    # the app needs is supplied as an environment variable here.
    env:
      ZCIP_DATABASE_URL: postgresql+asyncpg://placeholder:placeholder@127.0.0.1:5432/placeholder
      ZCIP_ENTRA_TENANT_ID: a10ba484-6331-40ee-b0ab-cb737ca60a80
      ZCIP_ENTRA_CLIENT_ID: c2d64a8e-670f-4aa6-bb96-861d444dcb0f
      ZCIP_ENTRA_API_AUDIENCE: api://c2d64a8e-670f-4aa6-bb96-861d444dcb0f
      # Also placeholders. The storage settings are required so a deployed environment
      # cannot start without them; nothing in the suite reaches Azure, and the blob tests
      # stub the SDK client. None of these values is a secret.
      ZCIP_STORAGE_ACCOUNT_URL: https://placeholder.blob.core.windows.net
      ZCIP_AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      ZCIP_DOCUMENT_INTELLIGENCE_ENDPOINT: https://placeholder.cognitiveservices.azure.com
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Fail loudly and early if the runner image ever changes such that
      # testcontainers has no daemon to talk to. Without this the failure
      # surfaces as an opaque connection error from inside a session fixture.
      - name: Docker daemon is available for testcontainers
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::No Docker daemon. The test suite starts PostgreSQL via testcontainers and cannot run without one."
            exit 1
          fi
          docker version --format 'docker {{.Server.Version}}'

      - name: Tests
        run: uv run pytest -q

  permissions-parity:
    name: Permission catalogue parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs/PERMISSIONS.md must be byte-identical in Z-CIP-BE and Z-CIP-FE.
      #
      # The default GITHUB_TOKEN is scoped to this repository only. If Z-CIP-FE
      # is private, this checkout cannot succeed with it. Supply a repository or
      # organisation secret named FRONTEND_REPO_TOKEN — a fine-grained PAT, or a
      # GitHub App installation token, with `Contents: read` on Z-CIP-FE and
      # nothing else. It is read from the secrets context and never printed.
      #
      # `continue-on-error` is on the checkout alone so the next step can turn a
      # 404-from-git into an actionable message. When checkout is unavailable,
      # the parity check is skipped with a warning rather than failing CI.
      - name: Check out the frontend repository
        id: checkout-frontend
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Z-CIP-FE
          path: frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Warn on a failed frontend checkout
        if: steps.checkout-frontend.outcome != 'success'
        run: |
          echo "::warning::Could not check out ${{ github.repository_owner }}/Z-CIP-FE, so PERMISSIONS.md parity was skipped."
          echo "::warning::If that repository is private, add a secret named FRONTEND_REPO_TOKEN with Contents: read on Z-CIP-FE."
          echo "::warning::If the repository was renamed or moved, update the 'repository:' input in .github/workflows/ci.yml."

      - name: PERMISSIONS.md must be byte-identical across repositories
        if: steps.checkout-frontend.outcome == 'success'
        run: |
          if ! diff -u docs/PERMISSIONS.md frontend/docs/PERMISSIONS.md; then
            echo "::error::docs/PERMISSIONS.md has drifted from the frontend repository. Both copies must be byte-identical; update whichever is stale."
            exit 1
          fi
          echo "PERMISSIONS.md is identical in both repositories."

  # Publishes the container image. Deliberately narrow: build and push, nothing
  # else. No deployment, no App Service restart, no Alembic run — see
  # docs/superpowers/specs/2026-08-20-container-image-ci-design.md for why each
  # of those is out of scope rather than merely unimplemented.
  image:
    name: Container image
    # A GitHub-hosted runner cannot be used. The registry sits behind a private
    # endpoint and is unreachable from the public internet, so `az acr login`
    # would hang and then time out.
    runs-on:
      group: dda-k8s-runner
    # Every gate that exists must pass before an image is published. Note that
    # `permissions-parity` is deliberately NOT here: it checks out Z-CIP-FE with
    # a token that may be absent, and a cross-repository documentation check must
    # not be able to block a release.
    needs: [static, tests]
    # Pull requests build nothing. With a single `:latest` tag, a PR build would
    # overwrite the image the dev environment pulls with unmerged code.
    if: github.event_name == 'push'
    permissions:
      # OIDC federated credential exchange. No client secret is stored anywhere.
      id-token: write
      contents: read
    env:
      REGISTRY_NAME: ${{ github.ref_name == 'main' && vars.REGISTRY_PROD || vars.REGISTRY }}
      IMAGE_REPOSITORY: cip-backend
    steps:
      - uses: actions/checkout@v4

      # The REGISTRY_NAME expression uses `&& ||`, which is not a ternary. When
      # the correct variable is unset, the expression falls through to the other
      # branch's variable instead of failing. This guard validates the
      # branch-specific variable directly before the image is pushed, preventing
      # a silent push to the wrong registry when the correct variable is absent.
      - name: The registry variable must be set
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            if [ -z "${{ vars.REGISTRY_PROD }}" ]; then
              echo "::error::REGISTRY_PROD is not set. Set the repository variable REGISTRY_PROD to the production ACR name, without the .azurecr.io suffix."
              exit 1
            fi
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            if [ -z "${{ vars.REGISTRY }}" ]; then
              echo "::error::REGISTRY is not set. Set the repository variable REGISTRY to the development ACR name, without the .azurecr.io suffix."
              exit 1
            fi
          fi
          echo "Publishing to ${REGISTRY_NAME}.azurecr.io/${IMAGE_REPOSITORY}"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ github.ref_name == 'main' && secrets.AZURE_CLIENT_ID_PROD || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ github.ref_name == 'main' && secrets.AZURE_TENANT_ID_PROD || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ github.ref_name == 'main' && secrets.AZURE_SUBSCRIPTION_ID_PROD || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the container registry
        run: az acr login --name "$REGISTRY_NAME"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # Attestations would add an unreferenced manifest to the repository.
          # Nothing here consumes them.
          provenance: false
          tags: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

