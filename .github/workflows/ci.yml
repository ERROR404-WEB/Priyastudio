  # Applies Alembic migrations to the deployed database.
  #
  # This reverses the original non-goal ("migrations stay a separate, deliberate
  # action"), and the reasoning has moved on: the safety checker in `static` now
  # enforces idempotent DDL, a single head, a real downgrade and an explicit
  # acknowledgement for destructive operations. What remains deliberate is the
  # ORDER - schema is applied only after the image that needs it exists, and the
  # app is restarted only after the schema is in place.
  #
  # `needs: image` is TEMPORARY. This should be `needs: pre-migrate-backup`, so
  # that no DDL can reach a database without a fresh labelled restore point; that
  # job is commented out above pending an RBAC grant. Restore the dependency in
  # the same change that re-enables it - a backup job nothing depends on protects
  # nobody.
  #
  # A GitHub-hosted runner cannot be used: the server is publicNetworkAccess
  # Disabled and resolves only to a private address.
  migrate:
    name: Database migration
    runs-on:
      group: dda-k8s-runner
    needs: image
    if: github.event_name == 'push'
    env:
      ZCIP_DATABASE_URL: ${{ github.ref_name == 'main' && secrets.ZCIP_DATABASE_URL_PROD || secrets.ZCIP_DATABASE_URL }}
      # alembic/env.py imports Settings, so `alembic upgrade` constructs the FULL
      # settings model before it opens a connection. A missing value here fails
      # with a pydantic ValidationError and no migration runs - the same failure
      # that stopped the container booting when
      # ZCIP_DOCUMENT_INTELLIGENCE_ENDPOINT was added. These are placeholders;
      # nothing in a migration reaches Entra, storage or Document Intelligence.
      ZCIP_ENTRA_TENANT_ID: placeholder
      ZCIP_ENTRA_CLIENT_ID: placeholder
      ZCIP_ENTRA_API_AUDIENCE: placeholder
      ZCIP_STORAGE_ACCOUNT_URL: https://placeholder.blob.core.windows.net
      ZCIP_AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      ZCIP_DOCUMENT_INTELLIGENCE_ENDPOINT: https://placeholder.cognitiveservices.azure.com
      # Migration 0002 creates the first platform administrator and is a SILENT
      # no-op when this is empty. It runs exactly once per database, so if it is
      # unset on the run that first reaches 0002, that environment has no
      # administrator, every user provisions as `viewer`, and nobody can grant
      # the first role. Re-running the pipeline does not fix it.
      ZCIP_BOOTSTRAP_ADMIN_EMAIL: ${{ github.ref_name == 'main' && vars.BOOTSTRAP_ADMIN_EMAIL_PROD || vars.BOOTSTRAP_ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: The database URL and bootstrap address must be set
        run: |
          set -euo pipefail
          # Same fall-through hazard as the backup job. Without this guard an
          # unset ZCIP_DATABASE_URL_PROD would silently migrate the DEV database
          # from a main build.
          if [ -z "${ZCIP_DATABASE_URL:-}" ]; then
            echo "::error::No database URL for '${{ github.ref_name }}'. Set the secret ZCIP_DATABASE_URL_PROD (main) or ZCIP_DATABASE_URL (develop)."
            exit 1
          fi
          if [ -z "${ZCIP_BOOTSTRAP_ADMIN_EMAIL:-}" ]; then
            echo "::error::BOOTSTRAP_ADMIN_EMAIL is unset for '${{ github.ref_name }}'. Migration 0002 would run as a no-op and this database would be left with no platform administrator, permanently - 0002 never runs twice. Set the repository variable (use the _PROD suffix on main) before merging."
            exit 1
          fi

      # `alembic current` before and after makes the job log say which revisions
      # this run actually applied, which is the first thing wanted when a
      # deployed environment misbehaves.
      - name: Current revision
        run: uv run alembic current

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Revision after upgrade
        run: uv run alembic current

  # Azure App Service continuous deployment is OFF for this app (verified: no
  # DOCKER_ENABLE_CI, and `az webapp deployment container show-cd-url` returns
  # False), so pushing `:latest` does NOT restart anything. Without this job the
  # new image sits in the registry until a human restarts the app, and the
  # database has already moved ahead of the running code.
  restart-app-service:
    name: Restart the App Service
    runs-on:
      group: dda-k8s-runner
    needs: migrate
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ github.ref_name == 'main' && secrets.AZURE_CLIENT_ID_PROD || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ github.ref_name == 'main' && secrets.AZURE_TENANT_ID_PROD || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ github.ref_name == 'main' && secrets.AZURE_SUBSCRIPTION_ID_PROD || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restart, then confirm the app answers
        env:
          RESOURCE_GROUP: ${{ github.ref_name == 'main' && vars.RESOURCE_GROUP_PROD || vars.RESOURCE_GROUP }}
          BACKEND_APP_SERVICE: ${{ github.ref_name == 'main' && vars.BACKEND_APP_SERVICE_PROD || vars.BACKEND_APP_SERVICE }}
        run: |
          set -euo pipefail
          if [ -z "${RESOURCE_GROUP:-}" ] || [ -z "${BACKEND_APP_SERVICE:-}" ]; then
            echo "::error::RESOURCE_GROUP and BACKEND_APP_SERVICE must be set for '${{ github.ref_name }}' (use the _PROD suffix on main)."
            exit 1
          fi
          az webapp restart --name "$BACKEND_APP_SERVICE" --resource-group "$RESOURCE_GROUP"

          # A restart command that returns 0 only means the request was
          # accepted. The container can still fail to boot - a missing setting
          # makes Settings() raise, the site stops, and every request 503s while
          # the browser reports it as a CORS error. Poll /health so that failure
          # is reported here, against this commit, rather than found by a user.
          HOST="$(az webapp show --name "$BACKEND_APP_SERVICE" --resource-group "$RESOURCE_GROUP" --query defaultHostName -o tsv)"
          echo "Waiting for https://${HOST}/health ..."
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://${HOST}/health" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "::notice::${BACKEND_APP_SERVICE} is healthy after restart."
              exit 0
            fi
            echo "  attempt ${attempt}/30: HTTP ${code}"
            sleep 10
          done
          echo "::error::${BACKEND_APP_SERVICE} did not return 200 from /health within 5 minutes. The migration HAS been applied; inspect the container logs (az webapp log download) before re-running."
          exit 1
